<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><title>Chorges Hier et Aujourd’hui</title><link rel="stylesheet" href="style.css"></head><body><video id="camera" autoplay playsinline muted></video><img id="overlay" alt="Photo ancienne superposée"><header class="top-panel"><img src="logo.png" class="logo" alt="Logo Chorges"><div class="titles"><div class="app-title">CHORGES</div><div class="app-subtitle">Hier et Aujourd’hui</div><div class="place-line"></div><div id="placeTitle" class="place-title">Chargement…</div><div id="placeDate" class="place-date"></div></div></header><div id="cameraPrompt" class="camera-prompt"><img src="logo.png" alt=""><h1>CHORGES</h1><p>Hier et Aujourd’hui</p><button id="startCameraBtn">Autoriser la caméra</button><small>Positionnez-vous dans les empreintes, puis ajustez la vue ancienne.</small></div><div class="side-tools"><button id="resetBtn"><span>◎</span><small>Recentrer</small></button><button id="hideBtn"><span>👁</span><small>Masquer</small></button></div><section class="bottom-panel"><div class="slider-labels"><span>Aujourd’hui</span><span id="dateLabel">Autrefois</span></div><input id="opacity" type="range" min="0" max="1" step="0.01" value="0.55"><div class="gesture-help"><span>Glisser : déplacer</span><span>Pincer : zoom</span><span>2 doigts : rotation</span></div></section><div id="errorBox" class="error-box"></div><script src="script.js"></script></body></html>
