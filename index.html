<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Chorges 1900</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <video id="camera" autoplay playsinline muted></video>
  <img id="overlay" alt="Vue historique superposée" />

  <div id="topbar">
    <div>
      <strong>Chorges 1900</strong><br>
      <span id="subtitle">Vue historique</span>
    </div>
    <button id="fullscreenBtn" type="button">⛶</button>
  </div>

  <div id="help">Placez-vous au bon endroit, puis alignez l’image ancienne avec vos doigts.</div>

  <div id="controls">
    <label>
      <span>Aujourd’hui ↔ 1900</span>
      <input id="opacity" type="range" min="0" max="1" step="0.01" value="0.55" />
    </label>
    <div class="buttons">
      <button id="resetBtn" type="button">↺ Recentrer</button>
      <button id="hideBtn" type="button">👁 Masquer</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
