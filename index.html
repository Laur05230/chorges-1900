<!DOCTYPE html><html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Chorges Hier et Aujourd’hui</title><link rel="stylesheet" href="style.css"></head><body>
<video id="camera" autoplay playsinline muted></video>
<img id="overlay" alt="Vue historique">
<header id="topbar"><div><div id="projectTitle">CHORGES</div><div id="projectSub">Hier et aujourd’hui</div></div><button id="fullscreenBtn">⛶</button></header>
<section id="placeCard"><div id="placeTitle">Chargement…</div><div id="placeDate"></div></section>
<div id="startPanel"><h1>Chorges Hier et Aujourd’hui</h1><p>Positionnez-vous dans les empreintes, puis ouvrez la caméra.</p><button id="startBtn">Ouvrir la caméra</button></div>
<section id="controls"><label><span>Aujourd’hui ↔ Hier</span><input id="opacity" type="range" min="0" max="1" step="0.01" value="0.55"></label><div class="buttons"><button id="resetBtn">↺</button><button id="hideBtn">👁</button><button id="infoBtn">ℹ️</button></div></section>
<dialog id="infoDialog"><h2 id="infoTitle"></h2><p id="infoDate"></p><p id="infoDescription"></p><button id="closeInfoBtn">Fermer</button></dialog>
<div id="errorBox"></div><script src="script.js"></script></body></html>
